<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Crypto Roulette</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060609;--card:#0e0e14;--card-b:#1a1a24;--text:#f0f0f5;--text2:#5a5a6e;
  --blue:#0098ea;--blue2:#2bb5ff;--green:#00e676;--gold:#ffd740;
  --pill:#1e1e2a;--pill-h:#282838;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);
  font-family:'Inter',sans-serif;overflow-x:hidden;overflow-y:auto;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-overflow-scrolling:touch}
#app{width:100%;max-width:480px;margin:0 auto;padding-top:calc(var(--safe-top)+4px);padding-bottom:calc(var(--safe-bot)+16px);min-height:100%}

/* TON SVG inline */
.ton-svg{width:14px;height:14px;vertical-align:middle;display:inline-block;flex-shrink:0}

/* ── HEADER ── */
.header{display:flex;gap:4px;padding:4px 8px 2px}
.hb{flex:1;background:var(--card);border:1px solid var(--card-b);border-radius:10px;padding:6px 8px}
.hl{font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-bottom:2px;font-weight:600}
.hv{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600}
.hav{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:700;color:#fff;flex-shrink:0}
.ha{margin-left:auto;color:var(--green);font-weight:700;white-space:nowrap;font-size:10px}

/* ── BALANCE ── */
.bal{display:flex;justify-content:center;align-items:center;gap:5px;padding:3px 8px 3px}
.bal span{font-size:11px;color:var(--text2);font-weight:500}
.bal-v{font-family:'Outfit',sans-serif;font-size:15px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:3px}

/* ── STATUS BAR ── */
.sbar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;
  background:var(--card);border:1px solid var(--card-b);border-radius:10px 10px 0 0;border-bottom:none;margin:0 8px}
.tp{display:flex;align-items:center;gap:5px;font-family:'Outfit',sans-serif}
.tp-l{font-size:12px;color:var(--text2);font-weight:600}
.tp-a{font-size:18px;font-weight:900;color:var(--blue)}
.sb{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;
  font-family:'Inter',sans-serif;letter-spacing:.3px}
.sb.w{background:rgba(255,255,255,.04);color:var(--text2)}
.sb.c{background:rgba(0,152,234,.12);color:var(--blue)}
.sb.l{background:rgba(0,152,234,.18);color:var(--blue2)}
.sd{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pd 1.5s infinite}
@keyframes pd{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.6)}}

/* ── ARENA ── */
.arena-w{position:relative;margin:0 8px;aspect-ratio:1/1;background:var(--card);
  border:1px solid var(--card-b);border-top:none;border-radius:0 0 10px 10px;overflow:hidden}
.arena-w canvas{width:100%;height:100%;display:block}

/* ── PLAYER CARDS (scrollable below field) ── */
.pcards{padding:8px 8px 4px}
.pcards-title{font-size:11px;color:var(--text2);font-weight:600;margin-bottom:6px;padding-left:4px;text-transform:uppercase;letter-spacing:.5px}
.pcard{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:5px;
  background:var(--card);border:1px solid var(--card-b);border-radius:12px}
.pcard-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.pcard-info{flex:1;min-width:0}
.pcard-name{font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-name.you{color:var(--gold)}
.pcard-pct{font-size:10px;color:var(--text2);font-weight:500;margin-top:1px}
.pcard-bet{font-family:'Outfit',sans-serif;font-size:14px;font-weight:800;color:var(--blue);white-space:nowrap;display:flex;align-items:center;gap:3px}

/* ── FOOTER ── */
.footer{display:flex;justify-content:space-between;align-items:center;padding:6px 12px 2px}
.footer-l,.footer-r{font-size:11px;font-weight:600;color:var(--text2)}
.footer-l span,.footer-r span{color:var(--text)}

/* ══ BET BAR — sticky bottom ══ */
.bet-bar{position:sticky;bottom:0;display:flex;gap:6px;padding:8px 10px 12px;
  background:linear-gradient(to top,var(--bg) 70%,transparent);align-items:center;z-index:50}
.bet-edit{width:46px;height:46px;border-radius:23px;background:var(--pill);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .12s}
.bet-edit:active{transform:scale(.88)}
.bet-edit svg{width:20px;height:20px;fill:var(--text)}
.pill{flex:1;height:46px;border-radius:23px;border:none;display:flex;align-items:center;justify-content:center;
  gap:4px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;
  color:#fff;transition:transform .1s,background .2s}
.pill:active{transform:scale(.92)}
.pill:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pill.grey{background:var(--pill);color:var(--text2)}
.pill.blue{background:var(--blue)}
.pill.vb{border-radius:23px;min-width:110px;background:var(--blue);font-size:14px;letter-spacing:.3px}

/* ══ MODALS ══ */
.mo{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:200;pointer-events:none;
  transition:background .3s;display:flex;align-items:flex-end;justify-content:center}
.mo.show{background:rgba(0,0,0,.6);pointer-events:auto;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ms{width:100%;max-width:480px;background:#141420;border-radius:20px 20px 0 0;
  padding:14px 20px calc(var(--safe-bot) + 24px);transform:translateY(100%);transition:transform .35s cubic-bezier(.32,1,.23,1)}
.mo.show .ms{transform:translateY(0)}
.mh{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin:0 auto 14px}
.mt{font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;margin-bottom:16px}

/* Edit tabs */
.etabs{display:flex;background:var(--pill);border-radius:14px;padding:3px;margin-bottom:20px;position:relative}
.etab{flex:1;padding:10px 0;border:none;border-radius:11px;background:transparent;
  color:var(--text2);font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;
  cursor:pointer;transition:color .2s;z-index:1;display:flex;align-items:center;justify-content:center;gap:3px}
.etab.active{color:#111}
/* Sliding indicator */
.etab-slider{position:absolute;top:3px;height:calc(100% - 6px);border-radius:11px;background:#fff;
  transition:left .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1);z-index:0}

/* Amount display */
.eamt{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px}
.eamt-v{font-family:'Outfit',sans-serif;font-size:46px;font-weight:900;color:var(--text)}
.eamt-u{font-family:'Outfit',sans-serif;font-size:20px;font-weight:600;color:var(--text2)}
/* Backspace icon */
.eamt-del{width:32px;height:32px;border-radius:50%;background:var(--pill);border:none;
  color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.eamt-del:active{transform:scale(.85)}
.eamt-del svg{width:18px;height:18px;fill:currentColor}

/* Slider */
.eslider{width:100%;margin:0 0 24px;-webkit-appearance:none;appearance:none;height:6px;
  border-radius:3px;background:var(--pill);outline:none}
.eslider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;
  background:#fff;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.eslider::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;cursor:pointer;border:none}

/* Buttons */
.mbtn{flex:1;padding:15px 0;border:none;border-radius:14px;font-family:'Outfit',sans-serif;
  font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s}
.mbtn:active{transform:scale(.95)}
.mbtn.sec{background:var(--pill);color:var(--text)}
.mbtn.pri{background:var(--blue);color:#fff}
.mbtns{display:flex;gap:10px}

/* Va-bank */
.vbt{font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;margin-bottom:16px}
.vba{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-bottom:24px}
.vba-v{font-family:'Outfit',sans-serif;font-size:46px;font-weight:900;color:var(--text)}
.vba-u{font-family:'Outfit',sans-serif;font-size:20px;font-weight:600;color:var(--text2)}
.vbc{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:12px;color:var(--text2)}
.vbc input{width:18px;height:18px;accent-color:var(--blue);border-radius:50%}

/* ── WINNER ── */
.wov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;
  justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .4s;backdrop-filter:blur(6px)}
.wov.show{opacity:1;pointer-events:auto}
.wc{background:#141420;border:1px solid var(--card-b);border-radius:20px;
  padding:24px 28px;text-align:center;max-width:280px;width:88%;position:relative;
  box-shadow:0 8px 40px rgba(0,0,0,.7),0 0 80px rgba(0,152,234,.1);
  transform:scale(.8);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.wov.show .wc{transform:scale(1)}
.wx{position:absolute;top:10px;right:12px;width:26px;height:26px;background:rgba(255,255,255,.05);
  border:none;border-radius:50%;color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.wcr{font-size:30px;margin-bottom:4px}
.wn{font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;margin-bottom:3px}
.wpct{font-size:11px;color:var(--text2);margin-bottom:8px;font-weight:500}
.wa{font-family:'Outfit',sans-serif;font-size:28px;font-weight:900;color:var(--blue);margin-bottom:2px}
.wm{font-size:12px;color:var(--gold);font-weight:700}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.cp{position:absolute;width:10px;height:10px;top:-20px;animation:cf linear forwards}
@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>

<!-- Va-bank Modal -->
<div class="mo" id="vMo">
  <div class="ms">
    <div class="mh"></div>
    <div class="vbt">Подтвердите ва-банк</div>
    <div class="vba"><span class="vba-v" id="vbV">0.00</span><span class="vba-u">TON</span></div>
    <div class="mbtns"><button class="mbtn sec" id="vbC">Назад</button><button class="mbtn pri" id="vbOk">Поставить</button></div>
    <label class="vbc"><input type="checkbox" id="vbNS">Больше не показывать</label>
  </div>
</div>

<!-- Winner -->
<div class="wov" id="wov"><div class="wc"><button class="wx" id="wx">✕</button><div class="wcr">👑</div><div class="wn" id="wn">—</div><div class="wpct" id="wpct">0%</div><div class="wa" id="wa">0 TON</div><div class="wm" id="wm">1.00x</div></div></div>
<div class="confetti" id="conf"></div>

<script>
// ── TG WebApp ──
let tgU=null,uN='@player_'+Math.random().toString(36).substr(2,5);
try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.disableVerticalSwipes();
  const u=Telegram.WebApp.initDataUnsafe?.user;if(u){tgU=u;uN=u.username?'@'+u.username:(u.first_name||'Player');}
  const st=Telegram.WebApp.safeAreaInset?.top||0,ct=Telegram.WebApp.contentSafeAreaInset?.top||0;
  document.documentElement.style.setProperty('--safe-top',(st+ct)+'px');}}catch(e){}

document.addEventListener('touchstart',e=>{if(!['INPUT','BUTTON','LABEL'].includes(e.target.tagName))document.activeElement?.blur();});

const socket=io(window.location.origin),canvas=document.getElementById('arena'),ctx=canvas.getContext('2d');
let csz=0,sc=1;const AR=600;
function resize(){const r=canvas.parentElement.getBoundingClientRect(),sz=Math.min(r.width,r.height);csz=sz;
  const d=window.devicePixelRatio||1;canvas.width=sz*d;canvas.height=sz*d;canvas.style.width=sz+'px';canvas.style.height=sz+'px';ctx.setTransform(d,0,0,d,0,0);sc=sz/AR;}
window.addEventListener('resize',resize);resize();

let state=null,pI={x:0,y:0,vx:0,vy:0},lPU=0,myBet=false,wShown=false,bal=1000,mySID=null;

// Balance persistence
const BAL_KEY='cr_balance_v5';
try{const sv=localStorage.getItem(BAL_KEY);if(sv!==null)bal=parseFloat(sv);}catch(e){}
function saveBal(){try{localStorage.setItem(BAL_KEY,String(bal));}catch(e){}}

// Pills
let pV=[1,5,10];const PD=[1,5,10];let skipVB=false;
try{const s=localStorage.getItem('pv5');if(s)pV=JSON.parse(s);skipVB=localStorage.getItem('svb')==='1';}catch(e){}
function saveP(){try{localStorage.setItem('pv5',JSON.stringify(pV));}catch(e){}}

function fP(n){return n>=1000?Math.round(n/1000)+'K':n%1===0?String(n):n.toFixed(1);}
function fN(n){if(Math.abs(n)>=1e6)return(n/1e6).toFixed(2)+'M';if(Math.abs(n)>=1000)return n.toLocaleString('ru-RU',{maximumFractionDigits:0});if(Math.abs(n)>=10)return n.toFixed(1);return n.toFixed(2);}
function tr(n){return n.length>14?n.substring(0,13)+'…':n;}
function canBet(){return state&&['waiting','countdown'].includes(state.phase);}

const tonI=`<svg class="ton-svg" viewBox="0 0 384 384" xmlns="http://www.w3.org/2000/svg"><path d="M192,354C102.45,354,30,281.55,30,192C30,102.45,102.45,30,192,30C281.55,30,354,102.45,354,192C354,281.55,281.55,354,192,354Z" fill="#0098EA"/><path d="M270.07,160.2C270.07,160.2,201.82,278.77,201.82,278.77C197.17,286.27,186.22,286.27,181.57,278.77L113.32,160.2C103.5,142.27,116.18,120.22,136.43,120.22H247.57C267.82,120.22,280.5,142.27,270.07,160.2Z M182.18,140.47H137.03C131.85,140.47,128.92,145.72,131.25,149.77L167.11,213.97L182.18,242.92V140.47Z M246.98,140.47H201.83V242.85L216.9,213.97L252.75,149.7C255.07,145.65,252.15,140.47,246.98,140.47Z" fill="#fff" fill-rule="evenodd"/></svg>`;

function updPills(){
  for(let i=0;i<3;i++){const b=document.getElementById('p'+(i+1)),v=pV[i],ok=bal>=v;
    b.className='pill '+(ok?'blue':'grey');b.innerHTML=tonI+' '+fP(v);b.disabled=myBet||!canBet();}
  const vb=document.getElementById('pVB');vb.disabled=myBet||!canBet()||bal<0.1;vb.className='pill vb'+(bal<0.1?' grey':'');}

// Pill clicks
for(let i=0;i<3;i++)document.getElementById('p'+(i+1)).addEventListener('click',()=>{if(pV[i]<=bal)placeBet(pV[i]);});
document.getElementById('pVB').addEventListener('click',()=>{if(bal<0.1)return;if(skipVB){placeBet(bal);return;}
  document.getElementById('vbV').textContent=fN(bal);document.getElementById('vMo').classList.add('show');});
document.getElementById('vbC').addEventListener('click',()=>document.getElementById('vMo').classList.remove('show'));
document.getElementById('vbOk').addEventListener('click',()=>{if(document.getElementById('vbNS').checked){skipVB=true;try{localStorage.setItem('svb','1');}catch(e){}}
  document.getElementById('vMo').classList.remove('show');placeBet(bal);});
document.getElementById('vMo').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('show');});

function placeBet(a){if(!canBet()||myBet)return;const v=Math.min(Math.round(a*100)/100,bal);if(v<0.1)return;
  socket.emit('place_bet',{name:uN,bet:v,avatar:null});}

// ── Edit Modal ──
let eI=0,eV=[...pV];
document.getElementById('editBtn').addEventListener('click',()=>{eV=[...pV];eI=0;refreshE();document.getElementById('eMo').classList.add('show');});

function refreshE(){
  document.querySelectorAll('.etab').forEach((t,i)=>{t.className='etab'+(i===eI?' active':'');t.innerHTML=tonI+' '+fP(eV[i]);});
  // Animate slider bg
  const tabs=document.querySelectorAll('.etab');const sl=document.getElementById('eSliderBg');
  if(tabs[eI]){const tr=tabs[eI].getBoundingClientRect(),pr=document.getElementById('eTabs').getBoundingClientRect();
    sl.style.left=(tr.left-pr.left)+'px';sl.style.width=tr.width+'px';}
  document.getElementById('eV').textContent=fP(eV[eI]);
  document.getElementById('eSl').value=eV[eI];}

document.querySelectorAll('.etab').forEach(t=>t.addEventListener('click',()=>{eI=parseInt(t.dataset.i);refreshE();}));
document.getElementById('eSl').addEventListener('input',e=>{let v=parseFloat(e.target.value);
  if(v<1)v=Math.round(v*10)/10;else if(v<10)v=Math.round(v);else if(v<100)v=Math.round(v/5)*5;else v=Math.round(v/10)*10;
  eV[eI]=v;document.getElementById('eV').textContent=fP(v);document.querySelectorAll('.etab')[eI].innerHTML=tonI+' '+fP(v);});
document.getElementById('eDel').addEventListener('click',()=>{eV[eI]=PD[eI];document.getElementById('eSl').value=PD[eI];refreshE();});
document.getElementById('eRst').addEventListener('click',()=>{eV=[...PD];refreshE();});
document.getElementById('eSav').addEventListener('click',()=>{pV=[...eV];saveP();updPills();document.getElementById('eMo').classList.remove('show');});
document.getElementById('eMo').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('show');});
// Position slider on open
setTimeout(refreshE,100);

// ── Socket ──
socket.on('connect',()=>{mySID=socket.id;socket.emit('restore_balance',{balance:bal});});
socket.on('game_state',s=>{state=s;
  if(s.puck){pI={x:s.puck.x,y:s.puck.y,vx:s.puck.vx,vy:s.puck.vy};lPU=performance.now();}
  if(s.phase==='result'&&s.winner&&!wShown){wShown=true;showW(s.winner);}
  if(['waiting','countdown'].includes(s.phase)){wShown=false;hideW();}
  if(s.phase==='waiting')myBet=false;
  updUI(s);});
socket.on('puck_update',p=>{pI={x:p.x,y:p.y,vx:p.vx,vy:p.vy};lPU=performance.now();});
socket.on('bet_accepted',()=>{myBet=true;updPills();const v=document.getElementById('pVB');v.textContent='✓';setTimeout(()=>v.textContent='Ва-банк',2000);});
socket.on('balance_update',d=>{bal=d.balance;saveBal();document.getElementById('balV').innerHTML=fN(bal)+' '+tonI;updPills();});
socket.on('error',e=>alert(e.message));

function updUI(s){
  document.getElementById('tN').textContent=tr(s.topGame.name);document.getElementById('tAm').innerHTML='+'+fN(s.topGame.amount)+' '+tonI;document.getElementById('tA').textContent=s.topGame.initials||'—';
  document.getElementById('lN').textContent=tr(s.lastGame.name);document.getElementById('lAm').innerHTML='+'+fN(s.lastGame.amount)+' '+tonI;document.getElementById('lA').textContent=s.lastGame.initials||'—';
  document.getElementById('totA').textContent=fN(s.totalPool);
  const b=document.getElementById('sBdg');b.className='sb';
  if(s.phase==='waiting'){b.classList.add('w');b.innerHTML=`<span>Ожидание ${s.players.length}/2</span>`;}
  else if(s.phase==='countdown'){b.classList.add('c');b.innerHTML=`<span>00:${String(s.timer).padStart(2,'0')}</span>`;}
  else if(s.phase==='spinning'||s.phase==='live'){b.classList.add('l');b.innerHTML=`<span class="sd"></span><span>В эфире</span>`;}
  else if(s.phase==='result'){b.classList.add('l');b.innerHTML=`<span class="sd"></span><span>Результат</span>`;}
  else{b.classList.add('w');b.innerHTML=`<span>Пауза...</span>`;}
  document.getElementById('pC').textContent=s.players.length;document.getElementById('rI').textContent='#'+s.roundId;
  updPills();
  // Player cards
  const pc=document.getElementById('pcards');const so=[...s.players].sort((a,b)=>b.bet-a.bet);
  pc.innerHTML='<div class="pcards-title">Ставки</div>'+so.map(p=>{const me=p.id===mySID;const pct=s.totalPool>0?(p.bet/s.totalPool*100).toFixed(1):'0';
    return `<div class="pcard"><div class="pcard-dot" style="background:${p.color}"></div><div class="pcard-info"><div class="pcard-name${me?' you':''}">${me?'You':tr(p.name)}</div><div class="pcard-pct">${pct}% шанс</div></div><div class="pcard-bet">${fN(p.bet)} ${tonI}</div></div>`;}).join('');}

function showW(w){const me=w.sectorId===mySID;document.getElementById('wn').textContent=me?'Вы выиграли!':w.name;
  document.getElementById('wpct').textContent='Шанс: '+w.percent+'%';document.getElementById('wa').textContent=fN(w.amount)+' TON';
  document.getElementById('wm').textContent=w.multiplier.toFixed(2)+'x';document.getElementById('wov').classList.add('show');doC();setTimeout(hideW,4000);}
function hideW(){document.getElementById('wov').classList.remove('show');}
document.getElementById('wx').addEventListener('click',hideW);
function doC(){const c=document.getElementById('conf');c.innerHTML='';const cl=['#0098EA','#2bb5ff','#FFD740','#00E676','#FF6B6B','#4ECDC4','#E040FB','#FF9100'];
  for(let i=0;i<60;i++){const p=document.createElement('div');p.className='cp';p.style.left=Math.random()*100+'%';p.style.background=cl[Math.floor(Math.random()*cl.length)];
    p.style.width=(6+Math.random()*8)+'px';p.style.height=(6+Math.random()*8)+'px';p.style.borderRadius=Math.random()>.5?'50%':'2px';
    p.style.animationDuration=(2+Math.random()*2)+'s';p.style.animationDelay=Math.random()*.8+'s';c.appendChild(p);}setTimeout(()=>c.innerHTML='',5000);}

// ═══ CANVAS ═══
let cZ=1,cX=0,cY=0;
function render(){requestAnimationFrame(render);if(!state)return;const s=sc;
  let tz=1,tx=AR/2,ty=AR/2;
  if(state.puck&&state.puck.launched&&state.phase==='live'){const sp=Math.sqrt(pI.vx**2+pI.vy**2);
    if(sp<4){const t=1-Math.max(0,(sp-.8)/3.2);tz=1+1.2*t;tx=pI.x;ty=pI.y;}}
  cZ+=(tz-cZ)*.04;cX+=(tx-cX)*.04;cY+=(ty-cY)*.04;
  ctx.clearRect(0,0,csz,csz);ctx.save();
  if(cZ>1.01){const cx=cX*s,cy=cY*s;ctx.translate(cx,cy);ctx.scale(cZ,cZ);ctx.translate(-cx,-cy);}

  if(state.sectors&&state.sectors.length){state.sectors.forEach(sec=>{
    const x=sec.x*s,y=sec.y*s,w=sec.w*s,h=sec.h*s;
    const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,sec.color);g.addColorStop(1,shade(sec.color,-20));
    ctx.fillStyle=g;ctx.globalAlpha=.85;ctx.beginPath();ctx.roundRect(x+.5,y+.5,w-1,h-1,Math.min(6,Math.min(w,h)*.06));ctx.fill();
    ctx.globalAlpha=1;ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.stroke();
    if(state.phase==='result'&&state.winner&&state.winner.sectorId===sec.playerId){ctx.save();ctx.strokeStyle='#0098EA';ctx.lineWidth=3;ctx.shadowColor='#0098EA';ctx.shadowBlur=20;ctx.beginPath();ctx.roundRect(x+2,y+2,w-4,h-4,4);ctx.stroke();ctx.restore();}
    const mn=Math.min(w,h);if(mn>26){const cx2=x+w/2,cy2=y+h/2,ar=Math.min(mn*.24,24);
      ctx.beginPath();ctx.arc(cx2,cy2-(mn>50?4:0),ar,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='#fff';ctx.font=`800 ${Math.max(ar*.6,7)}px 'Outfit',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';const me=sec.playerId===mySID;
      ctx.fillText(me?'ВЫ':(sec.initials||'??'),cx2,cy2-(mn>50?4:0));
      if(mn>50){ctx.fillStyle='rgba(255,255,255,.75)';ctx.font=`600 ${Math.max(7,Math.min(9,w*.055))}px 'Inter',sans-serif`;ctx.fillText(me?'You':tr(sec.name),cx2,cy2+ar+2);}
      if(mn>40){ctx.fillStyle='rgba(255,255,255,.35)';ctx.font=`600 7px 'Inter',sans-serif`;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(sec.percent+'%',x+3,y+2);}}});}
  else{ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,csz,csz);ctx.fillStyle='rgba(255,255,255,.06)';ctx.font=`700 16px 'Outfit',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Ожидание ставок...',csz/2,csz/2);}

  if(state.puck){const now=performance.now(),dt=Math.min((now-lPU)/(1000/30),1.5);
    let px=state.puck.launched?pI.x+pI.vx*dt:pI.x,py=state.puck.launched?pI.y+pI.vy*dt:pI.y;
    const sx=px*s,sy=py*s,pr=(state.puck.radius||16)*s,sp=Math.sqrt(pI.vx**2+pI.vy**2);
    ctx.save();ctx.shadowColor=`rgba(0,152,234,${Math.min(.7,.3+sp*.02)})`;ctx.shadowBlur=8+Math.min(sp,10)*2;
    ctx.beginPath();ctx.arc(sx,sy,pr,0,Math.PI*2);ctx.strokeStyle=`rgba(255,255,255,${Math.min(.9,.4+sp*.03)})`;ctx.lineWidth=2.5;ctx.stroke();ctx.restore();
    ctx.beginPath();ctx.arc(sx,sy,pr,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;ctx.stroke();
    const ch=pr*.55;ctx.beginPath();ctx.moveTo(sx-ch,sy);ctx.lineTo(sx+ch,sy);ctx.moveTo(sx,sy-ch);ctx.lineTo(sx,sy+ch);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.arc(sx,sy,2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.85)';ctx.fill();
    if(state.puck.launched&&sp>2){const tL=Math.min(sp*2.5,45)*s,a=Math.atan2(-pI.vy,-pI.vx);const tg=ctx.createLinearGradient(sx,sy,sx+Math.cos(a)*tL,sy+Math.sin(a)*tL);tg.addColorStop(0,`rgba(0,152,234,${Math.min(sp/18,.25)})`);tg.addColorStop(1,'rgba(0,152,234,0)');ctx.beginPath();ctx.moveTo(sx+Math.cos(a+.2)*pr,sy+Math.sin(a+.2)*pr);ctx.lineTo(sx+Math.cos(a)*tL,sy+Math.sin(a)*tL);ctx.lineTo(sx+Math.cos(a-.2)*pr,sy+Math.sin(a-.2)*pr);ctx.closePath();ctx.fillStyle=tg;ctx.fill();}
    if(!state.puck.launched&&state.phase==='spinning'){const sp2=(now/40)%(Math.PI*2),aL=pr*2.2,ax=sx+Math.cos(sp2)*aL,ay=sy+Math.sin(sp2)*aL;
      const lg=ctx.createLinearGradient(sx,sy,ax,ay);lg.addColorStop(0,'rgba(0,152,234,0.1)');lg.addColorStop(.6,'rgba(0,152,234,0.5)');lg.addColorStop(1,'rgba(0,152,234,1)');
      ctx.beginPath();ctx.moveTo(sx+Math.cos(sp2)*pr*1.1,sy+Math.sin(sp2)*pr*1.1);ctx.lineTo(ax,ay);ctx.strokeStyle=lg;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.stroke();ctx.lineCap='butt';
      const aA=Math.atan2(ay-sy,ax-sx),hl=10;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax-hl*Math.cos(aA-.3),ay-hl*Math.sin(aA-.3));ctx.lineTo(ax-hl*.5*Math.cos(aA),ay-hl*.5*Math.sin(aA));ctx.lineTo(ax-hl*Math.cos(aA+.3),ay-hl*Math.sin(aA+.3));ctx.closePath();ctx.fillStyle='rgba(0,152,234,0.9)';ctx.fill();
      for(let g=1;g<=2;g++){const gA=sp2-g*.5,gL=aL*(1-g*.12);ctx.beginPath();ctx.moveTo(sx+Math.cos(gA)*pr*1.1,sy+Math.sin(gA)*pr*1.1);ctx.lineTo(sx+Math.cos(gA)*gL,sy+Math.sin(gA)*gL);ctx.strokeStyle=`rgba(0,152,234,${.2-g*.07})`;ctx.lineWidth=2;ctx.stroke();}}}
  ctx.restore();}

function shade(c,p){let R=parseInt(c.substring(1,3),16),G=parseInt(c.substring(3,5),16),B=parseInt(c.substring(5,7),16);
  R=Math.max(0,Math.min(255,R+Math.round(R*p/100)));G=Math.max(0,Math.min(255,G+Math.round(G*p/100)));B=Math.max(0,Math.min(255,B+Math.round(B*p/100)));
  return '#'+(R<16?'0':'')+R.toString(16)+(G<16?'0':'')+G.toString(16)+(B<16?'0':'')+B.toString(16);}

requestAnimationFrame(render);setTimeout(resize,100);setTimeout(resize,500);
</script>
</body>
