<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crypto Roulette</title>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Unbounded:wght@400;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg-primary: #0a0a0f;
    --bg-card: #14141f;
    --bg-card-border: #1e1e2e;
    --text-primary: #e8e8f0;
    --text-secondary: #7a7a8e;
    --accent-green: #00e676;
    --accent-blue: #448aff;
    --accent-gold: #ffd740;
    --accent-red: #ff5252;
    --ton-blue: #0098ea;
    --ton-gradient: linear-gradient(135deg, #0098ea 0%, #69c4ff 100%);
    --glass-bg: rgba(20, 20, 31, 0.85);
    --glass-border: rgba(255, 255, 255, 0.06);
    --shadow-heavy: 0 8px 32px rgba(0, 0, 0, 0.6);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-xs: 6px;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #app {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  /* ── HEADER ── */
  .header {
    display: flex; gap: 6px;
    padding: 10px 12px 6px;
    flex-shrink: 0;
  }
  .header-block {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--bg-card-border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .header-label {
    font-size: 10px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: center;
  }
  .header-value {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
  }
  .header-avatar {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }
  .header-amount {
    margin-left: auto;
    color: var(--accent-green);
    font-weight: 700;
    white-space: nowrap;
  }
  .ton-icon {
    width: 14px; height: 14px;
    display: inline-block;
    vertical-align: middle;
  }
  .ton-icon svg { width: 100%; height: 100%; }

  /* ── ARENA WRAPPER ── */
  .arena-section {
    flex: 1;
    display: flex; flex-direction: column;
    padding: 6px 12px;
    min-height: 0;
  }
  
  /* Status bar above arena */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px;
    background: var(--bg-card);
    border: 1px solid var(--bg-card-border);
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    border-bottom: none;
  }
  .total-pool {
    display: flex; align-items: center; gap: 6px;
    font-family: 'Unbounded', sans-serif;
  }
  .total-label {
    font-size: 13px; color: var(--text-secondary);
  }
  .total-amount {
    font-size: 18px; font-weight: 800;
    color: var(--accent-green);
  }
  .status-badge {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    transition: all 0.3s ease;
  }
  .status-badge.waiting {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-secondary);
  }
  .status-badge.countdown {
    background: rgba(255, 152, 0, 0.15);
    color: #ff9800;
  }
  .status-badge.live {
    background: rgba(0, 230, 118, 0.15);
    color: var(--accent-green);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse-dot 1.5s infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }

  /* Canvas container */
  .arena-canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--bg-card);
    border: 1px solid var(--bg-card-border);
    border-top: none;
    border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    overflow: hidden;
  }
  .arena-canvas-wrap canvas {
    width: 100%; height: 100%;
    display: block;
  }

  /* ── FOOTER ── */
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px 10px;
    flex-shrink: 0;
  }
  .footer-left, .footer-right {
    font-size: 13px; font-weight: 600;
    color: var(--text-secondary);
  }
  .footer-left span, .footer-right span {
    color: var(--text-primary);
  }

  /* ── BET PANEL ── */
  .bet-panel {
    padding: 6px 12px 14px;
    flex-shrink: 0;
  }
  .bet-form {
    display: flex; gap: 8px; align-items: stretch;
  }
  .bet-input-wrap {
    flex: 1;
    position: relative;
  }
  .bet-input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--bg-card-border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; font-weight: 600;
    padding: 10px 40px 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .bet-input:focus {
    border-color: var(--ton-blue);
  }
  .bet-input::placeholder {
    color: var(--text-secondary);
    font-weight: 400;
  }
  .bet-ton-label {
    position: absolute;
    right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 12px; color: var(--ton-blue);
    font-weight: 700;
    pointer-events: none;
  }
  .bet-btn {
    background: var(--ton-gradient);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-family: 'Unbounded', sans-serif;
    font-size: 13px; font-weight: 700;
    padding: 10px 20px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    white-space: nowrap;
  }
  .bet-btn:active {
    transform: scale(0.95);
  }
  .bet-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  .bet-presets {
    display: flex; gap: 6px;
    margin-top: 6px;
  }
  .bet-preset {
    flex: 1;
    background: rgba(255,255,255, 0.04);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-xs);
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 600;
    padding: 5px 0;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .bet-preset:active {
    background: rgba(0, 152, 234, 0.15);
    color: var(--ton-blue);
    border-color: var(--ton-blue);
  }

  /* ── WINNER POPUP ── */
  .winner-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    backdrop-filter: blur(4px);
  }
  .winner-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .winner-card {
    background: var(--bg-card);
    border: 1px solid var(--bg-card-border);
    border-radius: 20px;
    padding: 28px 36px;
    text-align: center;
    max-width: 320px;
    width: 90%;
    position: relative;
    box-shadow: var(--shadow-heavy), 0 0 60px rgba(0, 230, 118, 0.15);
    transform: scale(0.8);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .winner-overlay.show .winner-card {
    transform: scale(1);
  }
  .winner-close {
    position: absolute;
    top: 12px; right: 14px;
    width: 28px; height: 28px;
    background: rgba(255,255,255,0.05);
    border: none; border-radius: 50%;
    color: var(--text-secondary);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .winner-crown { font-size: 36px; margin-bottom: 8px; }
  .winner-name {
    font-family: 'Unbounded', sans-serif;
    font-size: 18px; font-weight: 700;
    margin-bottom: 12px;
  }
  .winner-amount {
    font-family: 'Unbounded', sans-serif;
    font-size: 32px; font-weight: 900;
    color: var(--accent-green);
    margin-bottom: 4px;
  }
  .winner-multiplier {
    font-size: 14px;
    color: var(--accent-gold);
    font-weight: 700;
  }

  /* ── CONFETTI ── */
  .confetti-container {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 99;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 10px; height: 10px;
    top: -20px;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div class="header">
    <div class="header-block">
      <div class="header-label">Топ игра</div>
      <div class="header-value">
        <div class="header-avatar" id="topAvatar" style="background:#4CAF50">GO</div>
        <span id="topName">Grey Oscar</span>
        <span class="header-amount" id="topAmount">+28 001 ◈</span>
      </div>
    </div>
    <div class="header-block">
      <div class="header-label">Последняя игра</div>
      <div class="header-value">
        <div class="header-avatar" id="lastAvatar" style="background:#9C27B0">NA</div>
        <span id="lastName">@narcissist</span>
        <span class="header-amount" id="lastAmount">+120 ◈</span>
      </div>
    </div>
  </div>

  <!-- Arena Section -->
  <div class="arena-section">
    <div class="status-bar">
      <div class="total-pool">
        <span class="total-label">Тотал</span>
        <span class="total-amount" id="totalAmount">0.0</span>
        <span style="color: var(--ton-blue); font-size: 16px;">◈</span>
      </div>
      <div class="status-badge waiting" id="statusBadge">
        <span id="statusText">Ожидание 0/2</span>
      </div>
    </div>
    <div class="arena-canvas-wrap">
      <canvas id="arenaCanvas"></canvas>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-left">Игроки · <span id="playerCount">0</span></div>
    <div class="footer-right">Игра <span id="roundId">#39253</span></div>
  </div>

  <!-- Bet Panel -->
  <div class="bet-panel">
    <div class="bet-form">
      <div class="bet-input-wrap">
        <input type="number" class="bet-input" id="betInput" 
               placeholder="Сумма ставки" min="0.1" max="10000" step="0.1">
        <span class="bet-ton-label">TON</span>
      </div>
      <button class="bet-btn" id="betBtn">СТАВКА</button>
    </div>
    <div class="bet-presets">
      <button class="bet-preset" data-amount="0.5">0.5</button>
      <button class="bet-preset" data-amount="1">1</button>
      <button class="bet-preset" data-amount="5">5</button>
      <button class="bet-preset" data-amount="10">10</button>
      <button class="bet-preset" data-amount="50">50</button>
    </div>
  </div>
</div>

<!-- Winner Overlay -->
<div class="winner-overlay" id="winnerOverlay">
  <div class="winner-card">
    <button class="winner-close" id="winnerClose">✕</button>
    <div class="winner-crown">👑</div>
    <div class="winner-name" id="winnerName">—</div>
    <div class="winner-amount" id="winnerAmount">0 TON</div>
    <div class="winner-multiplier" id="winnerMultiplier">1.00x</div>
  </div>
</div>

<!-- Confetti container -->
<div class="confetti-container" id="confettiContainer"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// CLIENT — Crypto Roulette
// ═══════════════════════════════════════════════════════════════

const socket = io(window.location.origin);

// ── Canvas Setup ──
const canvas = document.getElementById('arenaCanvas');
const ctx = canvas.getContext('2d');
let canvasSize = 0;
let scale = 1;
const ARENA_LOGICAL = 600; // matches server

function resizeCanvas() {
  const wrap = canvas.parentElement;
  const rect = wrap.getBoundingClientRect();
  const size = Math.min(rect.width, rect.height);
  canvasSize = size;
  
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = size / ARENA_LOGICAL;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ── State ──
let state = null;
let puckInterp = { x: 0, y: 0, vx: 0, vy: 0, spinAngle: 0 };
let prevPuck = null;
let lastPuckUpdate = 0;
let myBetPlaced = false;
let winnerShown = false;

// ── Socket Events ──
socket.on('game_state', (s) => {
  state = s;
  updateUI(s);
  
  if (s.puck) {
    prevPuck = { ...puckInterp };
    puckInterp = {
      x: s.puck.x,
      y: s.puck.y,
      vx: s.puck.vx,
      vy: s.puck.vy,
      spinAngle: s.puck.spinAngle || 0,
    };
    lastPuckUpdate = performance.now();
  }
  
  if (s.phase === 'result' && s.winner && !winnerShown) {
    winnerShown = true;
    showWinner(s.winner);
  }
  
  if (s.phase === 'waiting' || s.phase === 'countdown') {
    winnerShown = false;
    hideWinner();
  }
  
  if (s.phase === 'waiting') {
    myBetPlaced = false;
    document.getElementById('betBtn').disabled = false;
  }
});

socket.on('puck_update', (p) => {
  prevPuck = { ...puckInterp };
  puckInterp = { x: p.x, y: p.y, vx: p.vx, vy: p.vy, spinAngle: p.spinAngle || 0 };
  lastPuckUpdate = performance.now();
});

socket.on('bet_accepted', () => {
  myBetPlaced = true;
  document.getElementById('betBtn').disabled = true;
  document.getElementById('betBtn').textContent = '✓';
  setTimeout(() => {
    document.getElementById('betBtn').textContent = 'СТАВКА';
  }, 2000);
});

socket.on('error', (e) => {
  alert(e.message);
});

// ── UI Updates ──
function updateUI(s) {
  // Top game
  document.getElementById('topName').textContent = truncName(s.topGame.name);
  document.getElementById('topAmount').textContent = '+' + formatNum(s.topGame.amount) + ' ◈';
  document.getElementById('topAvatar').textContent = s.topGame.initials || 'GO';
  
  // Last game
  document.getElementById('lastName').textContent = truncName(s.lastGame.name);
  document.getElementById('lastAmount').textContent = '+' + formatNum(s.lastGame.amount) + ' ◈';
  document.getElementById('lastAvatar').textContent = s.lastGame.initials || '--';
  
  // Total pool
  document.getElementById('totalAmount').textContent = formatNum(s.totalPool);
  
  // Status
  const badge = document.getElementById('statusBadge');
  const statusText = document.getElementById('statusText');
  badge.className = 'status-badge';
  
  if (s.phase === 'waiting') {
    badge.classList.add('waiting');
    statusText.textContent = `Ожидание ${s.players.length}/2`;
    badge.innerHTML = `<span id="statusText">${statusText.textContent}</span>`;
  } else if (s.phase === 'countdown') {
    badge.classList.add('countdown');
    const padded = String(s.timer).padStart(2, '0');
    badge.innerHTML = `<span id="statusText">Начало через 00:${padded}</span>`;
  } else if (s.phase === 'spinning' || s.phase === 'live') {
    badge.classList.add('live');
    badge.innerHTML = `<span class="status-dot"></span><span id="statusText">В эфире</span>`;
  } else if (s.phase === 'result') {
    badge.classList.add('live');
    badge.innerHTML = `<span class="status-dot"></span><span id="statusText">Результат</span>`;
  } else {
    badge.classList.add('waiting');
    badge.innerHTML = `<span id="statusText">Пауза...</span>`;
  }
  
  // Footer
  document.getElementById('playerCount').textContent = s.players.length;
  document.getElementById('roundId').textContent = '#' + s.roundId;
  
  // Bet button
  const canBet = (s.phase === 'waiting' || s.phase === 'countdown') && !myBetPlaced;
  document.getElementById('betBtn').disabled = !canBet;
}

function truncName(name) {
  return name.length > 14 ? name.substring(0, 13) + '…' : name;
}

function formatNum(n) {
  if (n >= 1000) return n.toLocaleString('ru-RU', { maximumFractionDigits: 0 });
  if (n >= 10) return n.toFixed(1);
  return n.toFixed(2);
}

// ── Bet Controls ──
document.getElementById('betBtn').addEventListener('click', () => {
  const input = document.getElementById('betInput');
  const bet = parseFloat(input.value);
  if (!bet || bet < 0.1) {
    input.focus();
    return;
  }
  socket.emit('place_bet', {
    name: '@player_' + Math.random().toString(36).substr(2, 5),
    bet,
    avatar: null,
  });
});

document.querySelectorAll('.bet-preset').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('betInput').value = btn.dataset.amount;
  });
});

// ── Winner Popup ──
function showWinner(w) {
  document.getElementById('winnerName').textContent = w.name;
  document.getElementById('winnerAmount').textContent = formatNum(w.amount) + ' TON';
  document.getElementById('winnerMultiplier').textContent = w.multiplier.toFixed(2) + 'x';
  document.getElementById('winnerOverlay').classList.add('show');
  spawnConfetti();
  
  setTimeout(() => hideWinner(), 4000);
}

function hideWinner() {
  document.getElementById('winnerOverlay').classList.remove('show');
}

document.getElementById('winnerClose').addEventListener('click', hideWinner);

// ── Confetti ──
function spawnConfetti() {
  const container = document.getElementById('confettiContainer');
  container.innerHTML = '';
  const colors = ['#FF6B6B','#4ECDC4','#FFD740','#448AFF','#FF5252','#00E676','#E040FB','#FF9100'];
  
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.animationDuration = (2 + Math.random() * 2) + 's';
    piece.style.animationDelay = Math.random() * 0.8 + 's';
    container.appendChild(piece);
  }
  
  setTimeout(() => { container.innerHTML = ''; }, 5000);
}

// ═══════════════════════════════════════════════════════════════
// CANVAS RENDERING — Main render loop
// ═══════════════════════════════════════════════════════════════

function render() {
  requestAnimationFrame(render);
  if (!state) return;
  
  const s = scale;
  ctx.clearRect(0, 0, canvasSize, canvasSize);
  
  // ── Draw sectors ──
  if (state.sectors && state.sectors.length > 0) {
    state.sectors.forEach((sec, i) => {
      const x = sec.x * s;
      const y = sec.y * s;
      const w = sec.w * s;
      const h = sec.h * s;
      
      // Sector fill
      ctx.fillStyle = sec.color;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(x, y, w, h);
      ctx.globalAlpha = 1;
      
      // Border
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x, y, w, h);
      
      // Highlight winner sector
      if (state.phase === 'result' && state.winner && state.winner.sectorId === sec.playerId) {
        ctx.strokeStyle = '#FFD740';
        ctx.lineWidth = 3;
        ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
        ctx.shadowColor = '#FFD740';
        ctx.shadowBlur = 15;
        ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
        ctx.shadowBlur = 0;
      }
      
      // Avatar circle & name (only if sector is big enough)
      const minDim = Math.min(w, h);
      if (minDim > 30) {
        const cx = x + w / 2;
        const cy = y + h / 2;
        const avatarR = Math.min(minDim * 0.28, 28);
        
        // Avatar circle
        ctx.beginPath();
        ctx.arc(cx, cy - (minDim > 60 ? 6 : 0), avatarR, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        // Initials
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(avatarR * 0.7, 8)}px 'Unbounded', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(sec.initials || '??', cx, cy - (minDim > 60 ? 6 : 0));
        
        // Name under avatar
        if (minDim > 60) {
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.font = `600 ${Math.max(8, Math.min(11, w * 0.07))}px 'JetBrains Mono', monospace`;
          ctx.fillText(
            truncName(sec.name),
            cx,
            cy + avatarR + 4
          );
        }
        
        // Percent in corner
        if (minDim > 50) {
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.font = `600 9px 'JetBrains Mono', monospace`;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText(sec.percent + '%', x + 5, y + 4);
        }
      }
    });
  } else {
    // Empty arena — gradient placeholder
    const grad = ctx.createLinearGradient(0, 0, canvasSize, canvasSize);
    grad.addColorStop(0, '#1a1a2e');
    grad.addColorStop(1, '#16213e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvasSize, canvasSize);
    
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.font = `700 20px 'Unbounded', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Ожидание ставок...', canvasSize / 2, canvasSize / 2);
  }
  
  // ── Draw puck ──
  if (state.puck) {
    // Interpolate puck position
    const now = performance.now();
    const dt = Math.min((now - lastPuckUpdate) / (1000 / 30), 1); // 30fps updates
    
    let px, py;
    if (state.puck.launched) {
      // Client-side prediction
      px = puckInterp.x + puckInterp.vx * dt;
      py = puckInterp.y + puckInterp.vy * dt;
    } else {
      px = puckInterp.x;
      py = puckInterp.y;
    }
    
    const screenX = px * s;
    const screenY = py * s;
    const puckR = (state.puck.radius || 12) * s;
    
    // Glow
    const speed = Math.sqrt(puckInterp.vx * puckInterp.vx + puckInterp.vy * puckInterp.vy);
    const glowIntensity = Math.min(speed / 15, 1);
    
    if (glowIntensity > 0.1) {
      ctx.shadowColor = `rgba(255, 255, 255, ${glowIntensity * 0.5})`;
      ctx.shadowBlur = 15 + glowIntensity * 20;
    }
    
    // Puck body
    const puckGrad = ctx.createRadialGradient(
      screenX - puckR * 0.2, screenY - puckR * 0.2, 0,
      screenX, screenY, puckR
    );
    puckGrad.addColorStop(0, '#ffffff');
    puckGrad.addColorStop(0.5, '#e0e0e0');
    puckGrad.addColorStop(1, '#999999');
    
    ctx.beginPath();
    ctx.arc(screenX, screenY, puckR, 0, Math.PI * 2);
    ctx.fillStyle = puckGrad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.shadowBlur = 0;
    
    // Inner ring
    ctx.beginPath();
    ctx.arc(screenX, screenY, puckR * 0.5, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(100,100,100,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    // Spinning indicator (before launch)
    if (!state.puck.launched && state.phase === 'spinning') {
      const spinT = (now / 100) % (Math.PI * 2);
      const arrowLen = puckR * 2.5;
      const ax = screenX + Math.cos(spinT) * arrowLen;
      const ay = screenY + Math.sin(spinT) * arrowLen;
      
      ctx.beginPath();
      ctx.moveTo(screenX, screenY);
      ctx.lineTo(ax, ay);
      ctx.strokeStyle = 'rgba(255, 215, 64, 0.8)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
      
      // Arrowhead
      const angle = Math.atan2(ay - screenY, ax - screenX);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax - 8 * Math.cos(angle - 0.4), ay - 8 * Math.sin(angle - 0.4));
      ctx.lineTo(ax - 8 * Math.cos(angle + 0.4), ay - 8 * Math.sin(angle + 0.4));
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 215, 64, 0.9)';
      ctx.fill();
    }
    
    // Speed trail
    if (state.puck.launched && speed > 2) {
      const trailLen = Math.min(speed * 3, 50) * s;
      const angle = Math.atan2(-puckInterp.vy, -puckInterp.vx);
      const trailGrad = ctx.createLinearGradient(
        screenX, screenY,
        screenX + Math.cos(angle) * trailLen,
        screenY + Math.sin(angle) * trailLen
      );
      trailGrad.addColorStop(0, `rgba(255,255,255,${Math.min(speed / 20, 0.4)})`);
      trailGrad.addColorStop(1, 'rgba(255,255,255,0)');
      
      ctx.beginPath();
      ctx.moveTo(
        screenX + Math.cos(angle + 0.3) * puckR,
        screenY + Math.sin(angle + 0.3) * puckR
      );
      ctx.lineTo(
        screenX + Math.cos(angle) * trailLen,
        screenY + Math.sin(angle) * trailLen
      );
      ctx.lineTo(
        screenX + Math.cos(angle - 0.3) * puckR,
        screenY + Math.sin(angle - 0.3) * puckR
      );
      ctx.closePath();
      ctx.fillStyle = trailGrad;
      ctx.fill();
    }
  }
}

requestAnimationFrame(render);

// Handle window resize
setTimeout(resizeCanvas, 100);
setTimeout(resizeCanvas, 500);
</script>
</body>
</html>
