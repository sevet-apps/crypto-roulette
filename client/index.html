<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Crypto Roulette</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.8/dist/lottie-player.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060609;--card:#0e0e14;--cb:#1a1a24;--t:#f0f0f5;--t2:#5a5a6e;--blue:#0098ea;--green:#00e676;--gold:#ffd740;--pill:#1e1e2a;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{width:100%;height:100%;background:var(--bg);color:var(--t);font-family:'Inter',sans-serif;overflow-x:hidden;overflow-y:auto;user-select:none;-webkit-tap-highlight-color:transparent}
#app{width:100%;max-width:480px;margin:0 auto;padding-top:calc(var(--st)+48px);padding-bottom:80px;min-height:100%}
.ton-s{width:14px;height:14px;vertical-align:middle;display:inline-block;flex-shrink:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px}
.topbar-left{display:flex;gap:6px}
.tb-btn{width:36px;height:36px;border-radius:50%;background:#1a1a28;border:1px solid #2a2a3a;display:flex;align-items:center;justify-content:center;cursor:pointer}.tb-btn svg{width:16px;height:16px;fill:#888}
.tb-bal{display:flex;align-items:center;gap:6px;background:#152035;border:1px solid #1e3050;border-radius:22px;padding:8px 16px 8px 10px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:800;cursor:pointer}
.header{display:flex;gap:4px;padding:2px 10px 4px}
.hb{flex:1;background:var(--card);border:1px solid var(--cb);border-radius:10px;padding:6px 8px}
.hl{font-size:8px;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-bottom:2px;font-weight:600}
.hv{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600}
.hav{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:700;color:#fff;flex-shrink:0}
.ha{margin-left:auto;color:var(--green);font-weight:700;white-space:nowrap;font-size:10px}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--card);border:1px solid var(--cb);border-radius:10px 10px 0 0;border-bottom:none;margin:0 10px}
.tp{display:flex;align-items:center;gap:5px;font-family:'Outfit',sans-serif}.tp-l{font-size:12px;color:var(--t2);font-weight:600}.tp-a{font-size:18px;font-weight:900;color:var(--blue)}
.sb{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.3px}
.sb.w{background:rgba(255,255,255,.04);color:var(--t2)}.sb.c{background:rgba(0,152,234,.12);color:var(--blue)}.sb.l{background:rgba(0,152,234,.18);color:#2bb5ff}
.sd{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pd 1.5s infinite}
@keyframes pd{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.6)}}
.arena-w{position:relative;margin:0 10px;aspect-ratio:1/1;background:var(--card);border:1px solid var(--cb);border-top:none;border-radius:0 0 10px 10px;overflow:hidden}
.arena-w canvas{width:100%;height:100%;display:block}
.footer{display:flex;justify-content:space-between;padding:5px 14px 2px}.footer span{font-size:11px;font-weight:600;color:var(--t2)}.footer b{color:var(--t)}
.pcards{padding:6px 10px 4px}
.pc-t{font-size:10px;color:var(--t2);font-weight:600;margin-bottom:4px;padding-left:4px;text-transform:uppercase;letter-spacing:.5px}
.pc{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:4px;background:var(--card);border:1px solid var(--cb);border-radius:12px}
.pc-d{width:12px;height:12px;border-radius:50%;flex-shrink:0}.pc-i{flex:1;min-width:0}.pc-n{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc-n.you{color:var(--gold)}.pc-p{font-size:10px;color:var(--t2);margin-top:1px}.pc-b{font-family:'Outfit',sans-serif;font-size:14px;font-weight:800;color:var(--blue);white-space:nowrap}
/* BET BAR */
.bet-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;gap:6px;padding:14px 12px calc(var(--sb)+18px);background:linear-gradient(to top,var(--bg) 85%,transparent);align-items:center;z-index:50}
.be{width:44px;height:44px;border-radius:22px;background:var(--pill);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}.be:active{transform:scale(.88)}.be svg{width:18px;height:18px;fill:var(--t)}
.pl{flex:1;height:46px;border-radius:23px;border:none;display:flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;color:#fff;transition:transform .1s}
.pl:active{transform:scale(.92)}.pl:disabled{opacity:.4;cursor:not-allowed;transform:none}.pl.g{background:var(--pill);color:var(--t2)}.pl.b{background:var(--blue)}.pl.vb{min-width:105px;font-size:14px;background:var(--blue)}
/* MODALS */
.mo{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:200;pointer-events:none;transition:background .3s;display:flex;align-items:flex-end;justify-content:center}
.mo.show{background:rgba(0,0,0,.6);pointer-events:auto;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ms{width:100%;max-width:480px;background:#121220;border-radius:24px 24px 0 0;padding:16px 24px calc(var(--sb)+24px);transform:translateY(100%);transition:transform .35s cubic-bezier(.32,1,.23,1)}
.mo.show .ms{transform:translateY(0)}
.mh{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin:0 auto 14px}
.mt{font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;margin-bottom:14px}
.etabs{display:flex;background:var(--pill);border-radius:18px;padding:3px;margin-bottom:14px;position:relative}
.etab{flex:1;padding:10px 0;border:none;border-radius:15px;background:transparent;color:var(--t2);font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:color .2s;z-index:1;display:flex;align-items:center;justify-content:center;gap:4px}.etab.active{color:#111}
.etab-slider{position:absolute;top:3px;height:calc(100% - 6px);border-radius:15px;background:#fff;transition:left .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1);z-index:0}
.eamt{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0}.eamt-v{font-family:'Outfit',sans-serif;font-size:38px;font-weight:900}.eamt-i{width:22px;height:22px}
.eamt-del{width:30px;height:30px;border-radius:50%;background:var(--pill);border:none;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center}.eamt-del:active{transform:scale(.85)}.eamt-del svg{width:16px;height:16px;fill:currentColor}
.eslider{width:100%;margin:0 0 16px;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--pill);outline:none}
.eslider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.mbtn{flex:1;padding:15px 0;border:none;border-radius:23px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s}.mbtn:active{transform:scale(.95)}.mbtn.sec{background:var(--pill);color:var(--t)}.mbtn.pri{background:var(--blue);color:#fff}
.mbtns{display:flex;gap:10px}
.vbc{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:12px;color:var(--t2)}.vbc input{width:18px;height:18px;accent-color:var(--blue)}
/* DEPOSIT — full screen */
.dep-ov{position:fixed;inset:0;background:var(--bg);z-index:250;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column}
.dep-ov.show{transform:translateX(0)}
.dep-header{display:flex;align-items:center;padding:calc(var(--st)+12px) 16px 8px;gap:10px}
.dep-back{width:36px;height:36px;border-radius:50%;background:#1a1a28;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}.dep-back svg{width:18px;height:18px;fill:var(--t)}
.dep-title{font-family:'Outfit',sans-serif;font-size:22px;font-weight:800}
.dep-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px}
.dep-card{background:#1a1a28;border:1px solid #2a2a3a;border-radius:20px;padding:24px;width:100%;text-align:center;margin-bottom:20px}
.dep-lbl{font-size:13px;color:var(--t2);margin-bottom:16px}
.dep-wallet{display:inline-flex;align-items:center;gap:6px;background:#2a2a3a;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;margin-bottom:20px}
.dep-amt-display{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px}
.dep-amt-val{font-family:'Outfit',sans-serif;font-size:46px;font-weight:900}
.dep-amt-unit{font-family:'Outfit',sans-serif;font-size:20px;font-weight:600;color:var(--t2)}
.dep-quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.dep-q{padding:8px 16px;border-radius:20px;background:#2a2a3a;border:none;color:var(--t);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px}.dep-q:active{background:#3a3a4a}
.dep-submit{width:calc(100% - 40px);max-width:400px;padding:16px;border:none;border-radius:23px;background:var(--blue);color:#fff;font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;cursor:pointer}.dep-submit:active{transform:scale(.97)}
.dep-submit:disabled{opacity:.4;cursor:not-allowed}
.dep-timer{font-size:12px;color:var(--t2);margin-top:10px;text-align:center}
/* WINNER */
.win-ov{position:fixed;inset:0;z-index:300;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;transition:background .3s}
.win-ov.show{pointer-events:auto;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.win-sheet{width:100%;max-width:480px;min-height:55vh;border-radius:24px 24px 0 0;overflow:hidden;transform:translateY(100%);transition:transform .4s cubic-bezier(.22,1,.36,1)}
.win-ov.show .win-sheet{transform:translateY(0)}
.win-top{background:linear-gradient(180deg,#1a5c2e 0%,#0f3d1d 50%,#0a2a14 100%);padding:24px 20px 20px;position:relative;text-align:center;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.win-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}.win-close svg{width:16px;height:16px;fill:#aaa}
.win-ring{position:absolute;top:16px;right:16px;width:36px;height:36px;pointer-events:none;z-index:1}
.win-ring svg{width:36px;height:36px;transform:rotate(-90deg)}
.win-ring circle{fill:none;stroke:rgba(255,255,255,.3);stroke-width:2;stroke-linecap:round}
.win-title{font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;margin-bottom:12px;color:#fff}
.win-lottie{width:180px;height:180px;margin:0 auto 12px}
.win-bot{background:#0c0c14;padding:20px 20px calc(var(--sb)+24px)}
.win-info{display:flex;align-items:center;justify-content:center;gap:14px;background:#161622;border-radius:18px;padding:16px 24px}
.win-amt{font-family:'Outfit',sans-serif;font-size:26px;font-weight:900}.win-mult{background:var(--blue);border-radius:14px;padding:6px 14px;font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;color:#fff}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:310;overflow:hidden}
.cp{position:absolute;top:-20px;animation:cf linear forwards}
@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style></head><body>

var tonSvg='<svg class="ton-s" viewBox="0 0 384 384"><path d="M192,354C102.45,354,30,281.55,30,192C30,102.45,102.45,30,192,30C281.55,30,354,102.45,354,192C354,281.55,281.55,354,192,354Z" fill="#0098EA"/><path d="M270.07,160.2L201.82,278.77C197.17,286.27,186.22,286.27,181.57,278.77L113.32,160.2C103.5,142.27,116.18,120.22,136.43,120.22H247.57C267.82,120.22,280.5,142.27,270.07,160.2Z M182.18,140.47H137.03C131.85,140.47,128.92,145.72,131.25,149.77L167.11,213.97L182.18,242.92V140.47Z M246.98,140.47H201.83V242.85L216.9,213.97L252.75,149.7C255.07,145.65,252.15,140.47,246.98,140.47Z" fill="#fff" fill-rule="evenodd"/></svg>';

function updDepBtn(){var ok=depAmt>0&&(Date.now()-depCD>=24*60*60*1000);document.getElementById('depOk').disabled=!ok;
  if(depCD&&Date.now()-depCD<24*60*60*1000){var left=depCD+24*60*60*1000-Date.now();var h=Math.floor(left/3600000),m=Math.floor((left%3600000)/60000);document.getElementById('depTimer').textContent='Следующее пополнение через '+h+'ч '+m+'м';}
  else document.getElementById('depTimer').textContent='';}

// Socket
sk.on('connect',function(){mySID=sk.id;sk.emit('auth',{username:uN});});

  if(s.ph==='waiting')myBet=false;updUI(s);});

function updUI(s){document.getElementById('tN').textContent=tr(s.top.name);document.getElementById('tAm').innerHTML='+'+fN(s.top.amt)+' '+tonSvg;document.getElementById('tA').textContent=s.top.ini||'—';
  document.getElementById('lN').textContent=tr(s.last.name);document.getElementById('lAm').innerHTML='+'+fN(s.last.amt)+' '+tonSvg;document.getElementById('lA').textContent=s.last.ini||'—';
  document.getElementById('totA').textContent=fN(s.pool);var b=document.getElementById('sBdg');b.className='sb';
  if(s.ph==='waiting'){b.classList.add('w');b.innerHTML='<span>Ожидание '+s.pl.length+'/2</span>';}
  else if(s.ph==='countdown'){b.classList.add('c');b.innerHTML='<span>00:'+String(s.timer).padStart(2,'0')+'</span>';}
  else if(s.ph==='spinning'||s.ph==='live'){b.classList.add('l');b.innerHTML='<span class="sd"></span><span>В эфире</span>';}
  else if(s.ph==='result'){b.classList.add('l');b.innerHTML='<span class="sd"></span><span>Результат</span>';}
  else{b.classList.add('w');b.innerHTML='<span>Пауза...</span>';}
  document.getElementById('pC').textContent=s.pl.length;document.getElementById('rI').textContent='#'+s.rid;updPills();
  var pc=document.getElementById('pcards'),so=s.pl.slice().sort(function(a,b2){return b2.bet-a.bet;});
  pc.innerHTML='<div class="pc-t">Ставки</div>'+so.map(function(p){var me=p.id===mySID,pct=s.pool>0?(p.bet/s.pool*100).toFixed(1):'0';
    return '<div class="pc"><div class="pc-d" style="background:'+p.color+'"></div><div class="pc-i"><div class="pc-n'+(me?' you':'')+'">'+(me?'You':tr(p.name))+'</div><div class="pc-p">'+pct+'% шанс</div></div><div class="pc-b">'+fN(p.bet)+' '+tonSvg+'</div></div>';}).join('');}
function showW(w){var me=w.sid===mySID;document.getElementById('winTitle').textContent=(me?'Вы':w.name)+' выиграл'+(me?'и':'');
  document.getElementById('winAmt').textContent=fN(w.amt)+' TON';document.getElementById('winMult').textContent=w.mult.toFixed(2)+'x';
  try{var lp=document.getElementById('winLottie');lp.stop();lp.play();}catch(e){}
  // Ring animation — exact circumference
  var ring=document.querySelector('#winRing circle');if(ring){var circ=2*Math.PI*16; // r=16
    ring.setAttribute('stroke-dasharray',circ);ring.style.transition='none';ring.style.strokeDashoffset='0';

  document.getElementById('winOv').classList.add('show');doC();clearTimeout(winTmr);winTmr=setTimeout(hideW,4500);}

function doC(){var c=document.getElementById('conf');c.innerHTML='';var cl=['#0098EA','#2bb5ff','#FFD740','#00E676','#FF6B6B','#4ECDC4','#E040FB','#FF9100'];
  for(var i=0;i<60;i++){var p=document.createElement('div');p.className='cp';p.style.left=Math.random()*100+'%';p.style.background=cl[Math.floor(Math.random()*cl.length)];p.style.width=(6+Math.random()*8)+'px';p.style.height=(6+Math.random()*8)+'px';p.style.borderRadius=Math.random()>.5?'50%':'2px';p.style.animationDuration=(2+Math.random()*2)+'s';p.style.animationDelay=Math.random()*.8+'s';c.appendChild(p);}setTimeout(function(){c.innerHTML='';},5000);}
// ═══ CANVAS ═══
var cZ=1,cX=0,cY=0,spinStart=0,spinAngle=0,spinSpeed=0.4,arrowStopped=false;
function render(){requestAnimationFrame(render);if(!S)return;var s=sc;
  if(traj&&S.ph==='live'){var elapsed=(performance.now()-trajStart)/1000;var frameF=elapsed*trajFPS;
    var fi=Math.min(Math.floor(frameF),traj.length-1);var frac=frameF-fi;
    var cur=traj[fi],nxt=traj[Math.min(fi+1,traj.length-1)];
    pkPos={x:cur[0]+(nxt[0]-cur[0])*frac,y:cur[1]+(nxt[1]-cur[1])*frac};}
  var tz=1,tx=AR/2,ty=AR/2;
  if(traj&&S.ph==='live'){var elapsed2=(performance.now()-trajStart)/1000;var progress=elapsed2*trajFPS/traj.length;
    if(progress>.7){var t2=Math.min((progress-.7)/.3,1);tz=1+1.2*t2;tx=pkPos.x;ty=pkPos.y;}}
  cZ+=(tz-cZ)*.04;cX+=(tx-cX)*.04;cY+=(ty-cY)*.04;
  cx.clearRect(0,0,csz,csz);cx.save();
  if(cZ>1.01){var c2=cX*s,c3=cY*s;cx.translate(c2,c3);cx.scale(cZ,cZ);cx.translate(-c2,-c3);}
  if(S.sec&&S.sec.length){S.sec.forEach(function(sec){
    // Draw polygon sector
    var poly=sec.poly;
    if(poly&&poly.length>2){
      cx.beginPath();cx.moveTo(poly[0][0]*s,poly[0][1]*s);
      for(var pi=1;pi<poly.length;pi++)cx.lineTo(poly[pi][0]*s,poly[pi][1]*s);
      cx.closePath();
      // Gradient from center outward
      var gcx=sec.cx*s,gcy=sec.cy*s;
      var g=cx.createRadialGradient(csz/2,csz/2,0,gcx,gcy,csz*.7);
      g.addColorStop(0,sec.color);g.addColorStop(1,shade(sec.color,-25));
      cx.fillStyle=g;cx.globalAlpha=.88;cx.fill();
      cx.globalAlpha=1;cx.strokeStyle='rgba(0,0,0,.5)';cx.lineWidth=1.5;cx.stroke();
      // Winner glow
      if(S.ph==='result'&&S.w&&S.w.sid===sec.pid){cx.save();cx.strokeStyle='#0098EA';cx.lineWidth=3;cx.shadowColor='#0098EA';cx.shadowBlur=20;cx.beginPath();cx.moveTo(poly[0][0]*s,poly[0][1]*s);for(var pi2=1;pi2<poly.length;pi2++)cx.lineTo(poly[pi2][0]*s,poly[pi2][1]*s);cx.closePath();cx.stroke();cx.restore();}
    } else {
      // Fallback rect
      var x=sec.x*s,y=sec.y*s,w=sec.w*s,h=sec.h*s;
      cx.fillStyle=sec.color;cx.globalAlpha=.88;cx.fillRect(x,y,w,h);cx.globalAlpha=1;
    }
    // Labels at centroid
    var lcx=sec.cx*s,lcy=sec.cy*s;
    var area=sec.w*sec.h*s*s;var mn=Math.min(sec.w*s,sec.h*s);
    var pctNum=parseFloat(sec.pct);
    if(pctNum>2){
      var ar=Math.min(Math.sqrt(area)*.12,24);
      // Avatar circle
      cx.beginPath();cx.arc(lcx,lcy-((pctNum>8)?4:0),ar,0,Math.PI*2);cx.fillStyle='rgba(0,0,0,.4)';cx.fill();cx.strokeStyle='rgba(255,255,255,.2)';cx.lineWidth=1.5;cx.stroke();
      // Initials
      cx.fillStyle='#fff';cx.font='800 '+Math.max(ar*.6,7)+'px Outfit,sans-serif';cx.textAlign='center';cx.textBaseline='middle';var me=sec.pid===mySID;
      cx.fillText(me?'ВЫ':(sec.ini||'??'),lcx,lcy-((pctNum>8)?4:0));
      // Name
      if(pctNum>8){cx.fillStyle='rgba(255,255,255,.75)';cx.font='600 '+Math.max(7,Math.min(10,ar*.5))+'px Inter,sans-serif';cx.fillText(me?'You':tr(sec.name),lcx,lcy+ar+2);}
      // Percent
      if(pctNum>3){cx.fillStyle='rgba(255,255,255,.4)';cx.font='600 7px Inter,sans-serif';cx.textAlign='center';cx.textBaseline='top';cx.fillText(sec.pct+'%',lcx,lcy-ar-10);}
