# будильник для бесплатного Render: free-инстанс засыпает через ~15 мин без запросов,
# а при засыпании стирается история (файловое хранилище). пингуем каждые ~4 мин.
# расписание GitHub иногда опаздывает, поэтому каждый запуск пингует 3 раза подряд,
# запуски перекрываются — пропуск одного не даёт серверу уснуть.
name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ping render
        run: |
          for i in 1 2 3; do
            curl -sS -m 90 --retry 2 https://crypto-roulette-1.onrender.com/ || true
            echo
            if [ "$i" -lt 3 ]; then sleep 240; fi
          done
