# запасной будильник для бесплатного Render. основной — самопинг в server.js,
# он держит сервер, пока тот запущен; этот будит его, если он всё же уснул.
# расписание GitHub сильно опаздывает, поэтому только как подстраховка.
name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ping render
        run: |
          curl -sS -m 90 --retry 2 https://crypto-roulette-1.onrender.com/ || true
