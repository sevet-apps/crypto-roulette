# будильник для бесплатного Render: free-инстанс засыпает через ~15 мин без запросов,
# а при засыпании стирается история (файловое хранилище). пингуем каждые ~4-5 мин.
# расписание GitHub иногда опаздывает, поэтому каждый запуск пингует 2 раза с паузой,
# запуски перекрываются — пропуск одного не даёт серверу уснуть.
name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ping render
        run: |
          curl -sS -m 90 --retry 2 https://crypto-roulette-1.onrender.com/ || true
          echo
          sleep 240
          curl -sS -m 90 --retry 2 https://crypto-roulette-1.onrender.com/ || true
